<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Halaman tidak ditemukan · KartuRT Monitoring</title>
    <script>
      try {
        if (localStorage.getItem('karturt-monitoring-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
    <style>
      :root { color-scheme: dark; background: #101513; color: #f0f4eb; font: 1.1rem system-ui, sans-serif }
      :root[data-theme="light"] { color-scheme: light; background: #f1f4ec; color: #18251d }
      body { margin: 0; padding: 2rem; min-height: calc(100svh - 4rem); display: grid; place-items: center }
      main { width: min(100%, 33rem) }
      h1 { font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -.045em }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border-radius: 8px; background: #b9e889; color: #18251d; font-weight: 700; text-decoration: none }
      a:active { scale: .97 }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.png" alt="" width="40" height="40">
      <p>KartuRT Monitoring · 404</p>
      <h1>Halaman tidak ditemukan</h1>
      <a href="/">← Kembali ke dasbor</a>
    </main>
  </body>
</html>
